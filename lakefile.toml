name = "constraint-directed-resolution"
version = "0.1.0"
keywords = ["lean4"]
defaultTargets = ["Main"]

[[lean_lib]]
name = "Main"
srcDir = "ConstraintDirectedResolution"
roots = [
  "main",
  "checker",
  "program",
  "examples.width_subtyping_examples",
  "examples.nullary_synthesized_examples",
  "examples.collapse_cert_examples",
  "examples.collapse_cert_diagnostics",
  "examples.program_examples.auto_success",
  "examples.program_examples.manual_proofs",
  "examples.program_examples.bad_index",
  "examples.program_examples.proof_failure",
  "examples.program_examples.multiple_modules"
]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.29.0"
